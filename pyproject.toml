[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "disclosure-research"
version = "0.1.0"
description = "Point-in-time research on annual risk disclosure changes and return forecasts"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.2,<2", "exchange-calendars>=4.8,<5", "lxml>=5.3,<7",
  "numpy>=2.0,<3", "pandas>=2.2,<3", "pyarrow>=19,<24",
  "scikit-learn>=1.6,<2"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
disclosure = "disclosure_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/disclosure_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
